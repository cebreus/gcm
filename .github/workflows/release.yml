name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Binaries & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verification checks
        run: |
          bun run check
          bun run lint
          bun run test

      - name: Build standalone binaries
        run: |
          mkdir -p dist/bin
          bun build ./gcm.ts --compile --target=bun-darwin-arm64 --outfile dist/bin/gcm-darwin-arm64 --minify
          bun build ./gcm.ts --compile --target=bun-darwin-x64 --outfile dist/bin/gcm-darwin-x64 --minify
          bun build ./gcm.ts --compile --target=bun-linux-x64 --outfile dist/bin/gcm-linux-x64 --minify
          bun build ./gcm.ts --compile --target=bun-linux-arm64 --outfile dist/bin/gcm-linux-arm64 --minify

      - name: Generate SHA-256 checksums
        run: |
          cd dist/bin
          sha256sum gcm-* > checksums.txt
          cat checksums.txt
          cd ../..

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver {flag=1; next}
            $0 ~ "^## " && flag {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release notes could not be extracted from CHANGELOG.md for version $VERSION" > RELEASE_NOTES.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            dist/bin/gcm-darwin-arm64 \
            dist/bin/gcm-darwin-x64 \
            dist/bin/gcm-linux-x64 \
            dist/bin/gcm-linux-arm64 \
            dist/bin/checksums.txt
